name: Validate plugin package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Validate package
        run: python scripts/validate_plugin.py
      - name: Build release archive
        run: python scripts/build_release.py
      - name: Validate clean extraction
        run: python scripts/validate_plugin.py --archive "dist/scene-specifications-builder-blender-mcp-$(cat VERSION).zip"
